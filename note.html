<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Geteilte Notiz · 2nd Brain</title>
  <link rel="icon" href="icons/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
  <style>
    body { overflow: auto; }
    [hidden] { display: none !important; }
    body::before { display: none; }
    .shared { max-width: 560px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 40px) 24px calc(env(safe-area-inset-bottom) + 40px); width: 100%; }
    .shared-head { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: .8235rem; }
    .shared-head img { width: 36px; height: 36px; border-radius: 9px; }
    .shared-note { margin: 24px 0 8px; padding: 20px; background: var(--card); border: 1px solid var(--line); border-radius: 16px;
      font-size: 1.0588rem; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
    .shared-cat { color: var(--muted); font-size: .7647rem; margin-bottom: 8px; }
    .shared .primary { margin-top: 20px; }
    .shared .secondary { display: block; width: 100%; margin-top: 10px; padding: 13px; border-radius: 12px; border: 1px solid var(--line); color: var(--fg); }
    .shared .small { margin-top: 18px; }
  </style>
</head>
<body>
  <main class="shared">
    <div class="shared-head"><img src="icons/apple-touch-icon.png" alt=""><span>Jemand hat dir eine Notiz aus <b>2nd Brain</b> geschickt</span></div>
    <div id="note" class="shared-note" aria-live="polite">Notiz wird geladen …</div>
    <div id="cat" class="shared-cat" hidden></div>
    <a id="app" class="primary" style="text-align:center;text-decoration:none" hidden>In 2nd Brain öffnen</a>
    <a id="web" class="secondary" style="text-align:center;text-decoration:none" hidden>Im Browser öffnen</a>
    <button id="copy" type="button" class="secondary" hidden>Text kopieren</button>
    <p class="small">„In 2nd Brain öffnen“ legt die Notiz als neue Notiz in deiner App ab. Die Notiz steckt nur in diesem Link,
      sie wird nirgends gespeichert.</p>
  </main>
  <script type="module">
    import { decodeNote } from './js/share-codec.js';
    const code = location.hash.slice(1);
    const $ = id => document.getElementById(id);
    try {
      if (!/^[\w-]+$/.test(code)) throw new Error();
      const n = await decodeNote(code);
      $('note').textContent = n.text;
      if (n.category) { $('cat').textContent = `Kategorie: ${n.category}`; $('cat').hidden = false; }
      $('app').href = `secondbrain://import?d=${code}`;
      $('web').href = `./#import=${code}`;
      $('copy').onclick = async () => {
        try { await navigator.clipboard.writeText(n.text); $('copy').textContent = 'Kopiert'; } catch { $('copy').textContent = 'Kopieren nicht möglich'; }
      };
      for (const id of ['app', 'web', 'copy']) $(id).hidden = false;
    } catch {
      $('note').textContent = 'Dieser Link enthält keine gültige Notiz. Vielleicht wurde er beim Kopieren abgeschnitten.';
    }
  </script>
</body>
</html>
